name: Build

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/DummyApp.Analytics.Functions/DummyApp.Analytics.Functions.csproj

      - name: Build
        run: dotnet build src/DummyApp.Analytics.Functions/DummyApp.Analytics.Functions.csproj --configuration Release --no-restore
